services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/neumadiesel.db
      UPLOAD_DIR: /app/data/uploads
      DETECTOR_MODE: mock
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - vision_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  vision_data:
